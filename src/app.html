<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
		/>
		<meta name="text-scale" content="scale" />
		<title>be present.</title>
		<meta
			name="description"
			content="A calm, private journaling space. Be present and write what's here now — your entries stay on your device."
		/>
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="present" />
		<meta property="og:title" content="be present." />
		<meta
			property="og:description"
			content="A calm, private journaling space. Be present and write what's here now."
		/>
		<meta property="og:image" content="/og.jpg" />
		<meta property="og:image:type" content="image/jpeg" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="800" />
		<meta property="og:image:alt" content="be present. — a mindful journal for everyday moments" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="be present." />
		<meta
			name="twitter:description"
			content="A calm, private journaling space. Be present and write what's here now."
		/>
		<meta name="twitter:image" content="/og.jpg" />
		<meta name="twitter:image:alt" content="be present. — a mindful journal for everyday moments" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<meta name="theme-color" content="#f9fcff" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="present" />
		<script>
			(function () {
				try {
					var bg = {
						light: '#faf9f5',
						dark: '#262624',
						sage: '#f4f5f0',
						sky: '#f9fcff',
						deep: '#15181c',
						'sage-dark': '#161816'
					};
					// the other half of each palette — keep in step with PAIR in theme.svelte.ts
					var pair = {
						light: 'dark',
						dark: 'light',
						sage: 'sage-dark',
						'sage-dark': 'sage',
						sky: 'deep',
						deep: 'sky'
					};
					var isDark = { dark: 1, deep: 1, 'sage-dark': 1 };
					var t = localStorage.getItem('present:theme');
					if (!bg[t]) {
						t = 'sky';
					}
					if (localStorage.getItem('present:theme-auto') === '1') {
						// day runs 06:00–17:59 local — keep in step with isNight() in theme.svelte.ts
						var h = new Date().getHours();
						var night = h < 6 || h >= 18;
						if (!!isDark[t] !== night) {
							t = pair[t];
						}
					}
					document.documentElement.setAttribute('data-theme', t);
					var m = document.querySelector('meta[name="theme-color"]');
					if (m) {
						m.setAttribute('content', bg[t]);
					}
				} catch (e) {}
			})();
		</script>
		<script>
			// Disable pinch-to-zoom and double-tap-to-zoom on mobile.
			(function () {
				var stop = function (e) {
					e.preventDefault();
				};
				// iOS Safari gesture events (ignore user-scalable=no).
				document.addEventListener('gesturestart', stop, { passive: false });
				document.addEventListener('gesturechange', stop, { passive: false });
				document.addEventListener('gestureend', stop, { passive: false });
				// Multi-touch pinch on touch-event browsers.
				document.addEventListener(
					'touchmove',
					function (e) {
						if (e.touches.length > 1) e.preventDefault();
					},
					{ passive: false }
				);
				// Double-tap zoom.
				var lastTouch = 0;
				document.addEventListener(
					'touchend',
					function (e) {
						var now = Date.now();
						if (now - lastTouch <= 300) e.preventDefault();
						lastTouch = now;
					},
					{ passive: false }
				);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
